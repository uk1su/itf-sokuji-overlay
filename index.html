<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ITF Sokuji Overlay</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans JP", "Yu Gothic", sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    .board { box-sizing: border-box; width: 800px; height: 160px; padding: 14px 20px; color: #fff;
      background: linear-gradient(110deg, rgba(8,15,30,.94), rgba(16,28,48,.90));
      border-left: 7px solid #42d392; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
    .teams { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; gap: 14px; }
    .team { min-width: 0; font-size: 31px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .team.right { text-align: right; }
    .score { font-size: 42px; font-weight: 900; text-align: center; letter-spacing: 1px; }
    .meta { display: flex; justify-content: center; gap: 28px; margin-top: 12px; font-size: 22px; font-weight: 700; color: #c9d4e5; }
    .diff.plus { color: #55e6a5; } .diff.minus { color: #ff7383; }
    .error { display: none; padding: 26px; font-size: 22px; color: #fff; background: rgba(130,20,30,.9); }
  </style>
</head>
<body>
  <main class="board" id="board">
    <div class="teams">
      <div class="team" id="team-a">ITF.</div>
      <div class="score"><span id="score-a">0</span> - <span id="score-b">0</span></div>
      <div class="team right" id="team-b">Opponent</div>
    </div>
    <div class="meta">
      <span class="diff" id="diff">±0</span>
      <span id="left">残り12レース</span>
    </div>
  </main>
  <div class="error" id="error">即時データを取得できません</div>
  <script>
    const params = new URLSearchParams(location.search);
    const pathParts = location.pathname.split('/').filter(Boolean);
    const overlayIndex = pathParts.lastIndexOf('overlay');
    const pathKey = overlayIndex >= 0 ? (pathParts[overlayIndex + 1] || '') : '';
    const key = params.get('key') || pathKey;
    const apiBase = (
      params.get('api') || 'https://140-245-94-102.sslip.io'
    ).replace(/\/+$/, '');
    const endpoint = key
      ? `${apiBase}/api/v1/sokuji/${encodeURIComponent(key)}`
      : `${apiBase}/api/v1/sokuji/current`;
    let failures = 0;

    function render(data) {
      document.getElementById('team-a').textContent = data.teams[0];
      document.getElementById('team-b').textContent = data.teams[1];
      document.getElementById('score-a').textContent = data.scores[0];
      document.getElementById('score-b').textContent = data.scores[1];
      const diff = document.getElementById('diff');
      diff.textContent = data.dif;
      diff.className = `diff ${data.dif.startsWith('+') ? 'plus' : data.dif.startsWith('-') ? 'minus' : ''}`;
      document.getElementById('left').textContent = `残り${data.left}レース`;
      document.getElementById('board').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      failures = 0;
    }

    async function refresh() {
      try {
        const response = await fetch(endpoint, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render(await response.json());
      } catch (error) {
        failures += 1;
        if (failures >= 3) showError(`即時データを取得できません (${error.message})`);
      }
    }

    function showError(message) {
      document.getElementById('board').style.display = 'none';
      const error = document.getElementById('error');
      error.textContent = message;
      error.style.display = 'block';
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
